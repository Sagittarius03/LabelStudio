name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project dependencies
        run: uv sync --locked --group build
      - name: Build portable app
        run: uv run pyinstaller --noconfirm --clean --windowed --name LabelStudio --add-data "logodeveloper.svg;." --collect-all pystrich --collect-all qrcode --collect-all barcode main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LabelStudio-Windows
          path: |
            dist/LabelStudio/
            dist/LabelStudio-Setup.exe
